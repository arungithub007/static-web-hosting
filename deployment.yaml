apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontenddeploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: arun_eks/dev
          ports:
            - containerPort: 80
